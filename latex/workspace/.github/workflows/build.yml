name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same image the Makefile uses locally (pulled from GHCR by make).
      # If you extend docker/Dockerfile, build it here instead:
      #   - run: make image
      - run: make lint
      - run: make svg

      - run: cp build/main.pdf "build/____repoName____.pdf"

      - uses: actions/upload-artifact@v4
        with:
          name: ____repoName____
          path: |
            build/____repoName____.pdf
            build/svg/*.svg
          if-no-files-found: error

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/____repoName____.pdf
