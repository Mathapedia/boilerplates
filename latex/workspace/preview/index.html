<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>edit + preview</title>
<style>
  /* Layout/theme lifted from the LaTeX2JS playground (Mathapedia/LaTeX2JS/playground). */
  :root {
    --bg: #101418; --bg-panel: #161b21; --bg-editor: #0d1117;
    --fg: #dbe2ea; --fg-dim: #8b98a5; --accent: #4f8cff; --error: #ff6b6b; --ok: #7ee787;
    --border: #2a333d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  body { display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; gap: 16px; padding: 8px 16px;
    background: var(--bg-panel); border-bottom: 1px solid var(--border); flex: none; }
  .topbar h1 { font-size: 16px; margin: 0; white-space: nowrap; }
  .badge { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em;
    color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 1px 8px;
    margin-left: 6px; vertical-align: middle; }
  .files { display: flex; flex-wrap: wrap; gap: 6px; }
  .file-btn { background: transparent; color: var(--fg-dim); border: 1px solid var(--border);
    border-radius: 6px; padding: 3px 10px; font-size: 12px; cursor: pointer;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .file-btn:hover { color: var(--fg); border-color: var(--accent); }
  .file-btn.active { color: var(--fg); border-color: var(--accent); background: #1c2632; }
  .status { margin-left: auto; font-size: 12px; color: var(--fg-dim); white-space: nowrap; }
  .status.ok { color: var(--ok); } .status.bad { color: var(--error); }

  .layout { display: grid; grid-template-columns: minmax(320px, 42%) 1fr; flex: 1; min-height: 0; }
  .pane { min-height: 0; display: flex; flex-direction: column; }
  .editor-pane { border-right: 1px solid var(--border); }
  .editor { flex: 1; min-height: 0; resize: none; border: none; outline: none;
    background: var(--bg-editor); color: #c9d4e0; font-size: 13px; line-height: 1.5; padding: 14px;
    tab-size: 2; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .diagnostics { flex: none; max-height: 130px; overflow: auto; background: var(--bg-panel);
    border-top: 1px solid var(--border); padding: 8px 12px; font-size: 11.5px; color: var(--fg-dim);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; }
  .diag-error { color: var(--error); }

  .preview-pane { overflow: auto; padding: 20px; background: #666; }
  .preview { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .preview img { background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.4); width: min(100%, 900px); }
</style>
</head>
<body>
<header class="topbar">
  <h1>LaTeX <span class="badge">edit + preview</span></h1>
  <nav id="files" class="files"></nav>
  <span id="status" class="status">waiting for build/svg/stamp…</span>
</header>

<main class="layout">
  <section class="pane editor-pane">
    <textarea id="editor" class="editor" spellcheck="false" autocomplete="off"
      autocorrect="off" autocapitalize="off"></textarea>
    <div id="diagnostics" class="diagnostics"></div>
  </section>
  <section class="pane preview-pane">
    <div id="output" class="preview"></div>
  </section>
</main>

<script>
// Left: textarea bound to a file under tex/, autosaved via PUT (preview/server.py).
// Right: latexmk -pvc rebuilds on save, dvisvgm writes build/svg/<doc>-N.svg + stamp,
// we poll the stamp and swap the page images in place.
const doc = new URLSearchParams(location.search).get('doc') || 'main';
const editor = document.getElementById('editor');
const output = document.getElementById('output');
const diagnostics = document.getElementById('diagnostics');
const filesBar = document.getElementById('files');
const status = document.getElementById('status');

let current = null;   // path of the open file, e.g. "tex/sections/introduction.tex"
let dirty = false;
let saveTimer;

function setStatus(text, cls) { status.textContent = text; status.className = `status ${cls || ''}`; }

// ---- files -------------------------------------------------------------

async function loadFiles() {
  const list = await (await fetch('/api/files')).json();
  filesBar.innerHTML = '';
  list.forEach((path) => {
    const btn = document.createElement('button');
    btn.className = 'file-btn';
    btn.textContent = path.replace(/^tex\//, '');
    btn.dataset.path = path;
    btn.addEventListener('click', () => openFile(path));
    filesBar.appendChild(btn);
  });
  const preferred = list.find((p) => p === `tex/${doc}.tex`) || list[0];
  if (preferred) openFile(preferred);
}

async function openFile(path) {
  if (dirty) await save();
  current = path;
  editor.value = await (await fetch(`/${path}?t=${Date.now()}`)).text();
  dirty = false;
  [...filesBar.children].forEach((b) => b.classList.toggle('active', b.dataset.path === path));
}

async function save() {
  if (!current || !dirty) return;
  dirty = false;
  const r = await fetch(`/${current}`, { method: 'PUT', body: editor.value });
  if (!r.ok) { dirty = true; setStatus(`save failed: ${r.statusText}`, 'bad'); return; }
  setStatus('saved, building…', '');
}

editor.addEventListener('input', () => {
  dirty = true;
  window.clearTimeout(saveTimer);
  saveTimer = window.setTimeout(save, 600);
});
editor.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === 's') { e.preventDefault(); save(); }
  if (e.key === 'Tab') {
    e.preventDefault();
    const { selectionStart: s, selectionEnd: t } = editor;
    editor.setRangeText('  ', s, t, 'end');
    editor.dispatchEvent(new Event('input'));
  }
});

// ---- preview -----------------------------------------------------------

let last = null;

async function loadLog() {
  try {
    const r = await fetch(`/build/${doc}.log?t=${Date.now()}`, { cache: 'no-store' });
    if (!r.ok) return;
    const lines = (await r.text()).split('\n');
    const errs = [];
    for (let i = 0; i < lines.length; i++) {
      if (lines[i].startsWith('!')) errs.push(lines.slice(i, i + 3).join('\n'));
      if (/^LaTeX Warning: (Reference|Citation) .* undefined/.test(lines[i])) errs.push(lines[i]);
    }
    diagnostics.innerHTML = errs.length
      ? errs.map((e) => `<div class="diag-error">${escapeHtml(e)}</div>`).join('')
      : '<div>no errors</div>';
  } catch { /* log not there yet */ }
}

function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

async function refresh() {
  try {
    const r = await fetch(`/build/svg/stamp?t=${Date.now()}`, { cache: 'no-store' });
    if (!r.ok) throw new Error(r.statusText);
    const stamp = (await r.text()).trim();
    if (stamp === last) return;
    last = stamp;
    let n = 0;
    for (;;) {
      const p = n + 1;
      const head = await fetch(`/build/svg/${doc}-${p}.svg?t=${stamp}`, { method: 'HEAD', cache: 'no-store' });
      if (!head.ok) break;
      let img = output.children[n];
      if (!img) { img = document.createElement('img'); output.appendChild(img); }
      img.src = `/build/svg/${doc}-${p}.svg?t=${stamp}`;
      img.alt = `page ${p}`;
      n++;
    }
    while (output.children.length > n) output.lastChild.remove();
    setStatus(`${n} page${n === 1 ? '' : 's'} · rendered ${new Date(stamp * 1000).toLocaleTimeString()}`, 'ok');
    loadLog();
  } catch (e) {
    if (!last) setStatus(`no render yet (${e.message})`, 'bad');
  }
}

loadFiles();
refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
